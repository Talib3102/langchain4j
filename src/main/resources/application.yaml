spring:
  application:
    name: firstAI
  main:
    allow-bean-definition-overriding: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/langchain4j?createDatabaseIfNotExist=true
    username: root
    password: root

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

langchain4j:
  open-ai:
    chat-model:
      api-key: ${GEMINI_API_KEY:your_api_key_here}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      model-name: gemini-3.5-flash-lite
      log-requests: true
      log-responses: true
      max-retries: 1
      timeout: 40s


#      ?createDatabaseIfNotExist=true
#      Adding ?createDatabaseIfNotExist=true to the URL ensures MySQL will automatically create the langchain4j database if it doesn't already exist.